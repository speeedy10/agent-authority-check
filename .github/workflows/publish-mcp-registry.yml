name: Validate FOXIFY MCP Registry Metadata

on:
  workflow_dispatch:
  push:
    paths:
      - "mcp-registry/server.json"
      - ".github/workflows/publish-mcp-registry.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" -o /tmp/mcp-publisher.tgz
          tar -xzf /tmp/mcp-publisher.tgz -C /tmp mcp-publisher
          chmod +x /tmp/mcp-publisher

      - name: Validate canonical FOXIFY metadata
        run: /tmp/mcp-publisher validate mcp-registry/server.json

      - name: Confirm branded remote
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open('mcp-registry/server.json'))
          assert d['name']=='pro.foxify/agent-commerce'
          assert d['version']=='0.2.1'
          assert d['remotes']==[{'type':'streamable-http','url':'https://foxify.pro/mcp'}]
          print('FOXIFY_REGISTRY_METADATA_PASS')
          PY

# Canonical domain publication is signed by the FOXIFY domain key from its
# private owner boundary. GitHub validates metadata but never receives that key.
